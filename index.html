<script>
window.dataLayer = window.dataLayer || [];

gtag('js', new Date());

<style>
* { 
box-sizing: border-box;
overflow-wrap: break-word;
hyphens: auto;
}
*::before, *::after {
box-sizing: inherit;
}
body {
margin: 0;
}
.error-container {
font-family: system-ui, Arial, sans-serif;
text-align: center;
padding: 20px;
background: #ffffff;
color: #1f2937;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
min-height: 100vh;
& .error-code {
font-size: clamp(5rem, 15vw, 8rem);
font-weight: 900;
background: linear-gradient(135deg, #3b82f6, #8b5cf6);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
line-height: 1;
margin: 0 0 10px 0;
}
& h2 {
font-size: clamp(1.5rem, 5vw, 2rem);
margin: 0 0 15px 0;
color: #111827;
}
& p {
color: #6b7280;
max-width: 400px;
margin: 0 0 40px 0;
line-height: 1.6;
}}
</style>
</head>
<body>
<main class="error-container">
<h1 class="error-code">Snart...</h1>
<h2>Kommer Sveriges bästa webbyrå.</h2>
</main>
</body>
